# Drop-in para el ollama.service que instala el script oficial.
# Nunca edites el unit original: el próximo install.sh lo sobrescribe.
#   sudo install -Dm644 deploy/ollama.service.d/override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
# Ollama no tiene autenticación y su API permite descargar y borrar modelos.
# Se queda en loopback SIEMPRE, aunque la app sí escuche en la LAN.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# El contexto por defecto de Ollama son 4096 tokens. Una propuesta completa lo
# desborda EN SILENCIO: el prompt se trunca, el modelo devuelve algo que no es
# JSON y extractJson lanza "El modelo no devolvió JSON válido", que parece un
# problema de calidad del modelo y no lo es. Súbelo al tamaño de la propuesta
# más larga que esperes. El KV total es CONTEXT_LENGTH * NUM_PARALLEL.
Environment="OLLAMA_CONTEXT_LENGTH=16384"

# El modelo se queda residente: recargarlo en frío tarda 60-120 s en CPU y se
# comería el timeout de la petición. En una caja dedicada, la RAM es para esto.
Environment="OLLAMA_KEEP_ALIVE=-1"

# Un solo modelo en memoria; con dos se duplican los pesos.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# server/index.js lanza DGOF e IROC con Promise.all: son DOS peticiones
# simultáneas al mismo modelo. Con 1 se serializan y el cotejo tarda el doble.
Environment="OLLAMA_NUM_PARALLEL=2"

Environment="OLLAMA_MAX_QUEUE=8"

# Si el kernel se queda sin memoria, que mate la app (que reinicia en 2 s) y no
# el modelo (que tarda minutos en volver a cargar). Sin MemoryMax= aquí: capar
# un proceso cuyo trabajo es sostener un mmap enorme provoca thrashing.
OOMScoreAdjust=-500
