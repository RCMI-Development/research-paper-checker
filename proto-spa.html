<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expediente de Cumplimiento — RCM (prototipo SPA)</title>
    <style>
      /* Prototipo: conserva sus propios nombres de token, con los valores
         de la paleta institucional (src/rcm.css). Sin esto el cotejo que
         se monta adentro va en oro RCM y la página anfitriona en gris. */
      :root {
        --paper: #F6F4EC;
        --card: #FFFFFF;
        --rule: #DCDACE;
        --ink: #22262B;
        --soft: #5B6169;
        --blue: #2E3A8C;
        --red: #A8202A;
        --amber: #7A6A34;
        --tint: #EFE9D8;
        --display: 'Oswald', 'Arial Narrow', sans-serif;
        --body: 'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif;
        --mono: 'IBM Plex Mono', 'Courier New', monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font-family: var(--body); min-height: 100vh;
      }
      .wrap { max-width: 940px; margin: 0 auto; padding: 34px 20px 70px; }

      header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 28px; }
      .eyebrow {
        font-family: var(--display); font-size: 12px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--soft); font-weight: 600;
      }
      h1 {
        font-family: var(--display); font-size: 44px; font-weight: 700; margin: 3px 0 0;
        letter-spacing: .02em; text-transform: uppercase; line-height: 1;
      }
      .blurb { font-size: 15px; margin: 12px 0 0; max-width: 660px; color: var(--soft); line-height: 1.55; }

      .status {
        margin-top: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--soft);
        display: flex; align-items: center; gap: 7px;
      }
      .dot { width: 8px; height: 8px; border-radius: 8px; background: var(--rule); flex-shrink: 0; }
      .dot.on { background: var(--blue); }
      .dot.off { background: var(--red); }

      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

      .tile {
        background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--accent, var(--rule));
        padding: 20px 18px; text-align: left; cursor: pointer; display: flex; flex-direction: column;
        min-height: 236px; font-family: var(--body); color: var(--ink);
      }
      .tile:hover { background: #fff; border-color: var(--accent, var(--rule)); }
      .tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .tile .num { font-family: var(--mono); font-size: 10px; color: var(--soft); letter-spacing: .12em; }
      .tile h2 {
        font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .04em;
        margin: 5px 0 8px; font-weight: 700; color: var(--accent);
      }
      .tile p { font-size: 13.5px; line-height: 1.55; color: var(--soft); margin: 0 0 14px; flex: 1; }
      .tile .meta {
        font-family: var(--mono); font-size: 10.5px; color: var(--soft);
        border-top: 1px dashed var(--rule); padding-top: 9px; margin-bottom: 12px;
      }
      .tile .cta {
        font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .1em;
        font-weight: 600; color: var(--ink);
      }
      .tile:hover .cta { color: var(--accent); }

      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
      .btn {
        font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
        font-size: 13px; padding: 10px 18px; border: 1.5px solid var(--ink);
        background: transparent; color: var(--ink); cursor: pointer;
      }
      .btn:hover { background: var(--ink); color: var(--card); }

      .note {
        font-size: 12.5px; color: var(--soft); line-height: 1.65;
        margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 14px;
      }

      /* La sobrecapa del cotejo vive en src/panel.css, compartida con
         la página del Decanato; entra por import desde src/panel.jsx. */
    </style>
    <link rel="icon" href="/upr-rcm-logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/proto-spa.jsx"></script>
  </body>
</html>
